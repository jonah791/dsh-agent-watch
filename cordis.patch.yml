# dsh-agent-watch 插件行（示例；实际配置在 watch profile 的 cordis.patch.yml 中提供）
- insert:
    - id: agent-watch
      name: dsh-agent-watch
      config:
        dshHome: C:/Users/tr/.dsh
        watchDirs: [C:/Users/tr/.dsh]
        legacyFlags: []
        bin: ''
        profile: web
        port: 3080
        baseUrl: http://127.0.0.1:3080
        preflightReadyMs: 20000
        crashWindowMs: 10000
        maxQuickExits: 3
        readyTimeoutMs: 30000
        incidentFile: C:/Users/tr/.dsh/.watch-incident.json
        defaultWorkspace: E:/alice
        debounceMs: 300
